[versions]
agp = "8.13.2"
kotlin = "2.0.21"
compose-bom = "2025.05.00"
hilt = "2.51.1"
room = "2.6.1"
datastore = "1.1.1"
okhttp = "4.12.0"
bouncycastle = "1.84"
security-crypto = "1.1.0-alpha06"
nav-compose = "2.8.3"
junit5 = "5.10.2"
mockk = "1.13.12"
coroutines = "1.9.0"
appcompat = "1.7.0"
material = "1.12.0"
stream-webrtc = "1.3.9"

[libraries]
appcompat              = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material               = { group = "com.google.android.material", name = "material", version.ref = "material" }
compose-bom            = { group="androidx.compose", name="compose-bom",              version.ref="compose-bom" }
compose-ui             = { group="androidx.compose.ui", name="ui" }
compose-material3      = { group="androidx.compose.material3", name="material3" }
compose-material-icons = { group="androidx.compose.material", name="material-icons-extended" }
compose-ui-tooling     = { group="androidx.compose.ui", name="ui-tooling-preview" }
activity-compose       = { group="androidx.activity", name="activity-compose",        version="1.9.3" }
nav-compose            = { group="androidx.navigation", name="navigation-compose",     version.ref="nav-compose" }
hilt-android           = { group="com.google.dagger", name="hilt-android",            version.ref="hilt" }
hilt-compiler          = { group="com.google.dagger", name="hilt-android-compiler",   version.ref="hilt" }
hilt-nav-compose       = { group="androidx.hilt", name="hilt-navigation-compose",     version="1.2.0" }
room-runtime           = { group="androidx.room", name="room-runtime",                version.ref="room" }
room-ktx               = { group="androidx.room", name="room-ktx",                    version.ref="room" }
room-compiler          = { group="androidx.room", name="room-compiler",               version.ref="room" }
datastore              = { group="androidx.datastore", name="datastore-preferences",  version.ref="datastore" }
security-crypto        = { group="androidx.security", name="security-crypto",         version.ref="security-crypto" }
okhttp                 = { group="com.squareup.okhttp3", name="okhttp",               version.ref="okhttp" }
bouncycastle           = { group="org.bouncycastle", name="bcprov-jdk18on",           version.ref="bouncycastle" }
coroutines-android     = { group="org.jetbrains.kotlinx", name="kotlinx-coroutines-android", version.ref="coroutines" }
zxing                  = { group="com.journeyapps", name="zxing-android-embedded",    version="4.3.0" }
junit5-api             = { group="org.junit.jupiter", name="junit-jupiter-api",       version.ref="junit5" }
junit5-engine          = { group="org.junit.jupiter", name="junit-jupiter-engine",    version.ref="junit5" }
mockk                  = { group="io.mockk", name="mockk",                            version.ref="mockk" }
coroutines-test        = { group="org.jetbrains.kotlinx", name="kotlinx-coroutines-test", version.ref="coroutines" }
compose-test           = { group="androidx.compose.ui", name="ui-test-junit4" }
hilt-testing           = { group="com.google.dagger", name="hilt-android-testing",   version.ref="hilt" }
okhttp-mockwebserver   = { group="com.squareup.okhttp3", name="mockwebserver",        version.ref="okhttp" }
stream-webrtc          = { group="io.getstream", name="stream-webrtc-android",        version.ref="stream-webrtc" }

[plugins]
android-app    = { id="com.android.application",             version.ref="agp" }
kotlin-android = { id="org.jetbrains.kotlin.android",        version.ref="kotlin" }
kotlin-kapt    = { id="org.jetbrains.kotlin.kapt",           version.ref="kotlin" }
hilt           = { id="com.google.dagger.hilt.android",      version.ref="hilt" }
kotlin-compose = { id="org.jetbrains.kotlin.plugin.compose", version.ref="kotlin" }
